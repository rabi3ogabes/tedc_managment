name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, gd, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan test

  backend-postgres:
    # Production runs on PostgreSQL (Supabase): catches type and SQL differences SQLite accepts.
    # The pgvector image (PostgreSQL 16 with the vector extension) also runs the assistant's pgvector store tests.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tedc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: tedc_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_EMULATE_PREPARES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, gd, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  backend-azurite:
    # The Azure Blob driver against the storage emulator: proves the SAS signatures and REST calls are accepted by the storage service.
    runs-on: ubuntu-latest
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports: ['10000:10000']
    defaults:
      run:
        working-directory: backend
    env:
      AZURITE_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, gd, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test --filter=AzureStorageTest

  backend-ldap:
    # Directory sign-in against a real LDAP server (OpenLDAP over LDAPS and STARTTLS, with its own certificate authority):
    # bind-and-search, wrong password, a disabled account, nested groups mapped to roles, untrusted or misnamed certificates.
    # Passwords are random for each run and never stored in the repository.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Certificate authority and server certificate for localhost
        working-directory: ${{ runner.temp }}
        run: |
          mkdir ldap-certs && cd ldap-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=TEDC CI directory CA" -keyout ca.key -out ca.crt \
            -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign,cRLSign
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" -keyout server.key -out server.csr
          printf 'subjectAltName=DNS:localhost\nbasicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 2 -extfile server.ext -out server.crt
          # The RFC 7919 ffdhe2048 group, written as PKCS#3 ("-dsaparam" would write X9.42, which GnuTLS in the image cannot read).
          openssl genpkey -genparam -algorithm DH -pkeyopt group:ffdhe2048 -out dhparam.pem || openssl dhparam -out dhparam.pem 2048
          grep -q 'BEGIN DH PARAMETERS' dhparam.pem
          chmod 644 ca.crt server.crt server.key dhparam.pem
      - name: Start OpenLDAP and seed the test directory
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ldap-utils > /dev/null
          admin=$(openssl rand -hex 16); user=$(openssl rand -hex 16)
          echo "::add-mask::$admin"; echo "::add-mask::$user"
          printf '%s' "$admin" > admin.pw; printf '%s' "$user" > user.pw; chmod 600 admin.pw user.pw
          docker run -d --name ldap -p 389:389 -p 636:636 \
            -e LDAP_DOMAIN=tedc.test -e LDAP_ORGANISATION="TEDC CI" -e LDAP_ADMIN_PASSWORD="$admin" \
            -e LDAP_TLS=true -e LDAP_TLS_CRT_FILENAME=server.crt -e LDAP_TLS_KEY_FILENAME=server.key -e LDAP_TLS_CA_CRT_FILENAME=ca.crt \
            -e LDAP_TLS_DH_PARAM_FILENAME=dhparam.pem -e LDAP_TLS_VERIFY_CLIENT=never \
            -v "$PWD/ldap-certs:/container/service/slapd/assets/certs" osixia/openldap:1.5.0 --copy-service
          for i in $(seq 1 60); do
            ldapsearch -x -H ldap://localhost:389 -D cn=admin,dc=tedc,dc=test -y admin.pw -b dc=tedc,dc=test -s base > /dev/null 2>&1 && break
            [ "$(docker inspect -f '{{.State.Running}}' ldap)" = true ] || { echo "The directory server stopped."; exit 1; }
            sleep 2
          done
          ldapadd -x -H ldap://localhost:389 -D cn=admin,dc=tedc,dc=test -y admin.pw -f "$GITHUB_WORKSPACE/backend/tests/Fixtures/ldap/seed.ldif"
          for u in sara nadia old; do
            ldappasswd -x -H ldap://localhost:389 -D cn=admin,dc=tedc,dc=test -y admin.pw -T user.pw "uid=$u,ou=people,dc=tedc,dc=test"
          done
          {
            echo "LDAP_TEST_HOST=localhost"
            echo "LDAP_TEST_ADMIN_PASSWORD=$admin"
            echo "LDAP_TEST_USER_PASSWORD=$user"
            echo "LDAP_TEST_CA_FILE=$PWD/ldap-certs/ca.crt"
          } >> "$GITHUB_ENV"
      - name: The directory answers over LDAPS and STARTTLS (with the OpenLDAP tools, before PHP is involved)
        working-directory: ${{ runner.temp }}
        run: |
          export LDAPTLS_CACERT="$PWD/ldap-certs/ca.crt"
          openssl s_client -connect localhost:636 -servername localhost -CAfile "$LDAPTLS_CACERT" -verify_hostname localhost -brief </dev/null 2>&1 | head -12 || true
          ldapwhoami -x -H ldaps://localhost:636 -D cn=admin,dc=tedc,dc=test -y admin.pw
          ldapwhoami -x -ZZ -H ldap://localhost:389 -D cn=admin,dc=tedc,dc=test -y admin.pw
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, gd, zip, ldap
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test --group=ldap
      - name: Directory server log (on failure)
        if: failure()
        run: docker logs ldap 2>&1 | tail -80

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
