name: Mobile APK

# Builds the Android app (release APK) and publishes it as a GitHub pre-release with a direct download link.
#
# API address baked into the app, in order: the `api_url` input, the repository variable TEDC_API_URL, then
# the production domain https://tedc-managment.vercel.app. Testers can still change it in the app (long-press the emblem
# on the sign-in screen).
#
# Optional repository secrets for a store-grade signature (otherwise the debug key is used, fine for testing):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: API base URL. Empty = https://tedc-managment.vercel.app/api/v1
        required: false
        default: ''
  push:
    branches: [main, 'claude/**']
    paths: ['mobile/**', '.github/workflows/mobile-apk.yml']

permissions:
  contents: write

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the API address
        id: api
        env:
          INPUT_URL: ${{ inputs.api_url }}
          VAR_URL: ${{ vars.TEDC_API_URL }}
        run: |
          # The production domain always serves the latest deployment. Per-deployment URLs are immutable
          # snapshots, so they are never baked into the app.
          PRODUCTION="https://tedc-managment.vercel.app/api/v1"
          pick="${INPUT_URL:-${VAR_URL:-$PRODUCTION}}"
          echo "url=$pick" >> "$GITHUB_OUTPUT"
          code=$(curl -sS -o body.json -w '%{http_code}' --max-time 25 "$pick/public/mobile-config" || echo 000)
          echo "GET $pick/public/mobile-config -> HTTP $code"
          head -c 400 body.json 2>/dev/null; echo
          if [ "$code" = "200" ]; then status="reachable ✅"; else status="HTTP $code from CI ⚠️ — check the deployment, or change the server in the app (long-press the emblem)"; fi
          echo "api_status=$status" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Release signing (optional)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "Signing with the release keystore."
          else
            echo "No keystore secrets: signing with the debug key (installable for testing)."
          fi

      - name: Build APK
        env:
          API_URL: ${{ steps.api.outputs.url }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          flutter build apk --release \
            --build-name="$VERSION" --build-number="${{ github.run_number }}" \
            --dart-define=API_URL="$API_URL" \
            --dart-define=APP_VERSION="$VERSION" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/tedc-mobile-$VERSION.apk"
          ls -la ../dist
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: tedc-mobile-${{ env.VERSION }}
          path: dist/*.apk

      - name: Publish pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: mobile-v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: TEDC Mobile ${{ env.VERSION }}
          prerelease: true
          files: dist/*.apk
          body: |
            **Android test build** — install the APK on the phone (allow "Install unknown apps" for your browser/files app).

            - API: `${{ steps.api.outputs.url }}` (${{ steps.api.outputs.api_status }})
            - Branch: `${{ github.ref_name }}` · commit `${{ github.sha }}`
            - Sign in with a demo account (password `Tedc@2026!`) or your own account.
            - Push notifications: enable and configure them on the dashboard → Settings → Notifications.
            - Change the server inside the app: long-press the emblem on the sign-in screen.

      - name: Summary
        run: |
          {
            echo "### 📱 TEDC Mobile ${VERSION}"
            echo "- Download: https://github.com/${{ github.repository }}/releases/tag/mobile-v${VERSION}"
            echo "- API: \`${{ steps.api.outputs.url }}\` — ${{ steps.api.outputs.api_status }}"
          } >> "$GITHUB_STEP_SUMMARY"
