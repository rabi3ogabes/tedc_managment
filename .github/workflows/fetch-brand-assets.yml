name: Fetch official brand assets

# Downloads the Ministry of Education and Higher Education logos from edu.gov.qa (not reachable from every
# build environment) and commits them to brand-source/ on the selected branch for review.
on:
  workflow_dispatch:
    inputs:
      extra_urls:
        description: Extra image URLs to download (space-separated, optional)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover and download logo candidates
        env:
          EXTRA: ${{ inputs.extra_urls }}
        run: |
          set -u
          mkdir -p brand-source
          # edu.gov.qa does not send its intermediate certificate. Browsers fetch it from the certificate's
          # AIA "CA Issuers" URL; do the same so TLS is still fully verified.
          cp /etc/ssl/certs/ca-certificates.crt bundle.pem
          echo | openssl s_client -connect www.edu.gov.qa:443 -servername www.edu.gov.qa -showcerts 2>/dev/null \
            | awk '/BEGIN CERT/{f=1} f{print} /END CERT/{exit}' > leaf.pem
          for aia in $(openssl x509 -in leaf.pem -noout -text | grep -oE 'CA Issuers - URI:[^ ]+' | sed 's/CA Issuers - URI://'); do
            echo "intermediate: $aia"
            curl -sSL --max-time 30 "$aia" -o inter.bin || continue
            (openssl x509 -inform DER -in inter.bin -outform PEM 2>/dev/null || openssl x509 -in inter.bin -outform PEM) >> bundle.pem
          done
          export CURL_CA_BUNDLE="$PWD/bundle.pem"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128 Safari/537.36"
          for page in https://www.edu.gov.qa/ar https://www.edu.gov.qa/en https://www.edu.gov.qa/; do
            curl -sSL -A "$UA" --max-time 40 "$page" -o page.html || continue
            echo "== $page ($(wc -c < page.html) bytes)"
            grep -oiE '(src|href|content)="[^"]+\.(png|svg|jpg|jpeg|webp|ico)[^"]*"' page.html | cut -d'"' -f2 | sort -u | tee -a candidates.txt
          done
          for u in $EXTRA; do echo "$u" >> candidates.txt; done
          sort -u candidates.txt | grep -iE 'logo|moe|ministry|brand|icon|favicon|header' > picked.txt || true
          echo "== picked"; cat picked.txt
          i=0
          while read -r url; do
            case "$url" in http*) full="$url" ;; //*) full="https:$url" ;; /*) full="https://www.edu.gov.qa$url" ;; *) full="https://www.edu.gov.qa/$url" ;; esac
            name=$(basename "${full%%\?*}" | tr -c 'A-Za-z0-9._-' '_')
            i=$((i+1))
            curl -sSL -A "$UA" --max-time 40 "$full" -o "brand-source/$(printf %02d $i)-$name" && echo "downloaded $full"
          done < picked.txt
          ls -la brand-source
          file brand-source/* || true
          { echo "# Downloaded from edu.gov.qa by .github/workflows/fetch-brand-assets.yml"; cat picked.txt; } > brand-source/SOURCES.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand-source
          git diff --cached --quiet && echo "nothing new" || (git commit -m "Add official brand assets fetched from edu.gov.qa" && git push)
