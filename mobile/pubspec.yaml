name: tedc_mobile
description: "TEDC Training Management & Impact Platform - mobile app for employees and schools."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  file_picker: ^13.1.0
  supabase_flutter: ^2.17.2
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/brand/moe-emblem.png

  # Tajawal (SIL Open Font License, see assets/fonts/OFL.txt) — Arabic + Latin in one family.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-400.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-500.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-700.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-800.ttf
          weight: 800


# App icon: the Ministry of Education and Higher Education emblem (assets/brand). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/app-icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/app-icon-foreground.png"
  adaptive_icon_monochrome: "assets/brand/app-icon-monochrome.png"
  min_sdk_android: 23
